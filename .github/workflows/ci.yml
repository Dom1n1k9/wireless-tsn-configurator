name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev libmosquitto-dev python3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Run tests
        working-directory: build
        run: |
          ./wtsn-tests
          ctest --output-on-failure   # includes test_json_host (agent JSON parser)

      - name: CPack package
        working-directory: build
        run: cpack -G TGZ

  python:
    name: Web GUI lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip paho-mqtt ruff

      - name: Ruff
        run: ruff check webgui.py wtsn_webgui tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  sanitizer:
    name: Sanitized build & test (ASan/UBSan)
    runs-on: ubuntu-latest
    # Blocking: ASan/UBSan must stay clean (leaks and UB fail the build).
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev libmosquitto-dev

      - name: Configure
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -- -j$(nproc)

      - name: Run tests
        working-directory: build-asan
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ctest --output-on-failure

  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    # Blocking: keep the warning/performance/portability baseline clean.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --std=c11 --language=c -Isrc \
            --suppress=missingIncludeSystem \
            src/common src/mvc src/db src/device src/domain src/config_version \
            src/qos src/vlan src/tas src/sensors src/stream src/mqtt src/fxmqtt \
            src/telemetry src/trace src/plugin src/app 2>&1 | tee cppcheck.log

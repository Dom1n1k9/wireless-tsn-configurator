name: ESP firmware

on:
  push:
    branches: [main]
    paths:
      - "esp32-agent/**"
      - "esp32-cam/**"
      - "shared/**"
      - ".github/workflows/esp.yml"
  pull_request:
    paths:
      - "esp32-agent/**"
      - "esp32-cam/**"
      - "shared/**"
      - ".github/workflows/esp.yml"
  workflow_dispatch:

jobs:
  build-agent:
    name: Build esp32-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: cache-idf
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: ${{ runner.os }}-esp-idf-v5.3

      - name: Install ESP-IDF v5.3
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git clone -b v5.3 --depth 1 https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh esp32

      - name: Build
        working-directory: esp32-agent
        run: |
          . ~/esp-idf/export.sh
          idf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-agent-firmware
          path: esp32-agent/build/*.bin
          if-no-files-found: warn

  build-cam:
    name: Build esp32-cam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: cache-idf
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: ${{ runner.os }}-esp-idf-v5.3

      - name: Install ESP-IDF v5.3
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git clone -b v5.3 --depth 1 https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh esp32

      - name: Build
        working-directory: esp32-cam
        run: |
          . ~/esp-idf/export.sh
          idf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-cam-firmware
          path: esp32-cam/build/*.bin
          if-no-files-found: warn

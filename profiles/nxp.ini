# Device profile: NXP i.MX (generic W-TSN profile)

[device]
id = nxp-04
name = NXP i.MX8 Node
kind = nxp
firmware = 3.0.1
model = iMX8M-Plus

[network]
ip = 192.168.1.104
mac = AA:BB:CC:00:00:04
mqtt_topic = tsn/nodes/nxp-04

[capabilities]
tsn_features = qbv:802.1as:qci:psfp:qos:vlan

[services]
qos = on
vlan = on
timesync = on
tas = on
sensors = on

[qos]
priority = 6
traffic_class = 6
bandwidth_kbps = 40000
latency_ms = 1

[vlan]
vlan_id = 200
group = backbone

[timesync]
mode = slave
grandmaster = 192.168.1.102
protocol = gptp
offset_ns = 220

[tas]
cycle_time_ns = 1000000
deploy_target = local

[gcl]
0 = open:500000
1 = closed:500000

[sensors]
0 = temperature:temp1:degC:28.9
1 = pressure:press1:hPa:1008.4
2 = imu:imu1:g:0.03
3 = gpio:gpio1::0

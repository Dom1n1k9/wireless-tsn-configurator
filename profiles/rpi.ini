# Device profile: Raspberry Pi (generic Linux/gateway W-TSN profile)

[device]
id = rpi-02
name = Raspberry Pi Gateway
kind = raspberry_pi
firmware = 2.1.0
model = Raspberry Pi 4B

[network]
ip = 192.168.1.102
mac = AA:BB:CC:00:00:02
mqtt_topic = tsn/nodes/rpi-02

[capabilities]
tsn_features = qbv:802.1as:qci:qos:vlan

[services]
qos = on
vlan = on
timesync = grandmaster
tas = on
sensors = on

[qos]
priority = 6
traffic_class = 5
bandwidth_kbps = 50000
latency_ms = 1

[vlan]
vlan_id = 200
group = backbone

[timesync]
mode = master
grandmaster = 192.168.1.102
protocol = gptp
offset_ns = 0

[tas]
cycle_time_ns = 2000000
deploy_target = all

[gcl]
0 = open:800000
1 = open:600000
2 = closed:600000

[sensors]
0 = temperature:temp1:degC:32.1
1 = pressure:press1:hPa:1005.7
2 = imu:imu1:g:0.01
3 = gpio:gpio1::0

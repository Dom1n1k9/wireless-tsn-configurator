# Device profile: STM32 (generic W-TSN profile)

[device]
id = stm32-03
name = STM32 Motion Node
kind = stm32
firmware = 1.0.8
model = STM32H743

[network]
ip = 192.168.1.103
mac = AA:BB:CC:00:00:03
mqtt_topic = tsn/nodes/stm32-03

[capabilities]
tsn_features = qbv:qos:vlan:802.1as

[services]
qos = on
vlan = on
timesync = on
tas = on
sensors = on

[qos]
priority = 4
traffic_class = 3
bandwidth_kbps = 8000
latency_ms = 3

[vlan]
vlan_id = 100
group = shopfloor-a

[timesync]
mode = slave
grandmaster = 192.168.1.1
protocol = gptp
offset_ns = 510

[tas]
cycle_time_ns = 500000
deploy_target = gateway

[gcl]
0 = open:200000
1 = closed:300000

[sensors]
0 = imu:imu1:g:0.05
1 = distance:dist1:cm:12.3
2 = gpio:gpio1::1

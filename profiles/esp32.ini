# Device profile: ESP32 (generic W-TSN profile)
# The simulator runs these values; it does not emulate real silicon.

[device]
id = esp32-01
name = ESP32 Node 1
kind = esp32
firmware = 1.4.2
model = ESP32-WROOM-32

[network]
ip = 192.168.1.101
mac = AA:BB:CC:00:00:01
mqtt_topic = tsn/nodes/esp32-01

[capabilities]
tsn_features = qbv:802.1as:qos:vlan

[services]
qos = on
vlan = on
timesync = on
tas = on
sensors = on

[qos]
priority = 5
traffic_class = 4
bandwidth_kbps = 12000
latency_ms = 2

[vlan]
vlan_id = 100
group = shopfloor-a

[timesync]
mode = slave
grandmaster = 192.168.1.1
protocol = gptp
offset_ns = 340

[tas]
cycle_time_ns = 1000000
deploy_target = gateway

[gcl]
0 = open:400000
1 = closed:600000

[sensors]
0 = temperature:temp1:degC:24.5
1 = pressure:press1:hPa:1013.2
2 = imu:imu1:g:0.02
3 = distance:dist1:cm:45.0
4 = gpio:gpio1::1

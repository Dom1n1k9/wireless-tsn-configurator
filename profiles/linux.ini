# Device profile: Generic Linux node (bare-metal Linux W-TSN node)
# This profile is fully configurable; it represents an arbitrary Linux host.

[device]
id = linux-05
name = Generic Linux Node
kind = linux
firmware = 5.15.0
model = Linux x86_64

[network]
ip = 192.168.1.105
mac = AA:BB:CC:00:00:05
mqtt_topic = tsn/nodes/linux-05

[capabilities]
tsn_features = qbv:802.1as:qos:vlan:qci

[services]
qos = on
vlan = on
timesync = on
tas = on
sensors = on

[qos]
priority = 5
traffic_class = 4
bandwidth_kbps = 15000
latency_ms = 4

[vlan]
vlan_id = 300
group = lab

[timesync]
mode = slave
grandmaster = 192.168.1.102
protocol = 802.1as
offset_ns = 90

[tas]
cycle_time_ns = 4000000
deploy_target = local

[gcl]
0 = open:1500000
1 = closed:2500000

[sensors]
0 = temperature:temp1:degC:26.0
1 = gpio:gpio1::0
